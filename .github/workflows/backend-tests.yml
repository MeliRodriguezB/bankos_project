name: Backend tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - develop

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate root Docker Compose configuration
        run: docker compose -f ../docker-compose.yml config --quiet
      - name: Compile backend and migration modules
        run: python -m compileall -q app migrations
      - name: Run backend tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: PYTHONPATH=. pytest -q

      - name: Start the root Docker Compose stack
        env:
          BOOTSTRAP_ADMIN_EMAIL: bankos-admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-123456
        run: docker compose -f ../docker-compose.yml up --build -d

      - name: Verify API health and OpenAPI v1
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f ../docker-compose.yml logs api db redis
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/openapi.json | python -c "import json, sys; spec=json.load(sys.stdin); assert spec['info']['version'] == '1.0.0'; assert '/api/v1/transactions/transfers' in spec['paths']"

      - name: Verify both demo tenants, roles and tenant configuration
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base_url = "http://localhost:8000/api/v1"

          def request(path, payload=None, token=None, method=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              body = json.dumps(payload).encode() if payload is not None else None
              request_method = method or ("POST" if payload is not None else "GET")
              req = Request(
                  f"{base_url}{path}",
                  data=body,
                  headers=headers,
                  method=request_method,
              )
              try:
                  with urlopen(req, timeout=10) as response:
                      return json.loads(response.read())
              except HTTPError as error:
                  print(f"Request {path} failed ({error.code}): {error.read().decode()}")
                  raise

          scenarios = [
              ("cooperativa-futuro", "1002348911", "8880001234", "1000000.00"),
              ("neobanco-agil", "8880001234", "1002348911", "2000000.00"),
          ]
          for tenant_slug, expected_account, foreign_account, transfer_limit in scenarios:
              customer = request("/auth/login", {
                  "tenant_slug": tenant_slug,
                  "email": "carlos@fintech.com",
                  "password": "123456",
              })
              accounts = request("/accounts", token=customer["access_token"])
              account_numbers = {account["account_number"] for account in accounts}
              assert expected_account in account_numbers, tenant_slug
              assert foreign_account not in account_numbers, tenant_slug

              admin = request("/auth/login", {
                  "tenant_slug": tenant_slug,
                  "email": "bankos-admin@example.test",
                  "password": "ci-only-admin-password-123456",
              })
              config = {
                  "max_transfer_amount": transfer_limit,
                  "transfer_fees": {"COP": "1000.00", "USD": "1.00"},
                  "transfer_fee_percent": "0.0050",
                  "primary_currency": "COP",
                  "supported_currencies": ["COP", "USD"],
                  "exchange_rates": {
                      "COP/USD": "0.00025",
                      "USD/COP": "4000.00",
                  },
                  "webhook_url": f"https://hooks.example.test/{tenant_slug}",
              }
              updated = request(
                  "/tenant/config",
                  payload=config,
                  token=admin["access_token"],
                  method="PATCH",
              )
              current = request("/tenant/config", token=admin["access_token"])
              assert float(updated["max_transfer_amount"]) == float(transfer_limit)
              assert current["transfer_fees"]["COP"] == "1000.00"
              assert current["supported_currencies"] == ["COP", "USD"]
              assert current["exchange_rates"]["USD/COP"] == "4000.00"
              assert current["webhook_url"] == config["webhook_url"]
          print("Customer/admin roles and independent configuration passed for both tenants.")
          PY

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f ../docker-compose.yml logs api db redis

      - name: Verify PostgreSQL transaction audit is append-only
        run: |
          docker compose -f ../docker-compose.yml exec -T api python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import text

          from app.db.session import SessionLocal, engine
          from app.modules.transactions.models import Transaction

          session = SessionLocal()
          record = Transaction(
              tenant_id="audit-smoke-tenant",
              user_id="audit-smoke-user",
              type="DEPOSIT",
              amount=Decimal("1.00"),
              currency="COP",
              status="COMPLETED",
              description="append-only smoke",
          )
          session.add(record)
          session.commit()
          record_id = record.id
          session.close()

          mutations = [
              ("UPDATE financial_transactions SET description = 'changed' WHERE id = :id", "update"),
              ("DELETE FROM financial_transactions WHERE id = :id", "delete"),
          ]
          for statement, operation in mutations:
              try:
                  with engine.begin() as connection:
                      connection.execute(text(statement), {"id": record_id})
              except Exception as exc:
                  if "immutable" not in str(exc).lower():
                      raise
              else:
                  raise AssertionError(f"PostgreSQL trigger allowed {operation}")

          with engine.connect() as connection:
              description = connection.execute(
                  text("SELECT description FROM financial_transactions WHERE id = :id"),
                  {"id": record_id},
              ).scalar_one()
          assert description == "append-only smoke"
          print("PostgreSQL UPDATE and DELETE protections verified.")
          PY

      - name: Stop the root Docker Compose stack
        if: always()
        run: docker compose -f ../docker-compose.yml down -v
