
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bankos_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bankos_user:bankos_dev_password@db:5432/bankos_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: bankos_db
    environment:
      POSTGRES_DB: bankos_db
      POSTGRES_USER: bankos_user
      POSTGRES_PASSWORD: bankos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - bankos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankos_user -d bankos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bankos_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  bankos_postgres_data:
