name: Flutter CI

on:
  push:
    branches:
      - develop
      - "fix/**"
  pull_request:
    branches:
      - develop
      - "fix/**"

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Flutter validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Informational lint messages should not block CI; warnings and errors still fail.
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug
