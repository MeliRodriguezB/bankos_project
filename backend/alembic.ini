[alembic]
# Directorio donde Alembic almacenará las revisiones.
script_location = %(here)s/migrations

# Permite importar la aplicación desde la carpeta backend.
prepend_sys_path = .

# La URL real se obtiene de Settings en migrations/env.py.
sqlalchemy.url = postgresql+psycopg://bankos_user:bankos_dev_password@localhost:5432/bankos_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
